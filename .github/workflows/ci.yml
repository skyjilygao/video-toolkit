name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: python -m ruff check src/ tests/

      - name: Black 格式检查
        run: python -m black --check src/ tests/

      - name: 运行测试
        run: python -m pytest

  conventions:
    name: 开发规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认 AGENTS.md 存在（规则 SSOT）
        run: test -f AGENTS.md

      - name: 确认 .gitignore 忽略 .bak 备份文件
        run: |
          if ! grep -q '\*.bak' .gitignore; then
            echo "::error::.gitignore 未忽略 .bak 备份文件"
            exit 1
          fi

      - name: 确认仓库中无 .bak 备份文件
        run: |
          if find . -name "*.bak*" -not -path "./.git/*" | grep -q .; then
            echo "::error::仓库中存在 .bak 备份文件，禁止提交"
            find . -name "*.bak*" -not -path "./.git/*"
            exit 1
          fi
