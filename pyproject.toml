[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-toolkit"
version = "0.1.0"
description = "视频拆解与生成工具 - Video Decomposition and Generation Toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.5"
authors = [
    { name = "Video Toolkit" },
]
keywords = ["video", "analysis", "decomposition", "composition", "editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "opencv-python>=4.8.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
audio = ["librosa>=0.10.0", "soundfile>=0.12.0"]
detection = ["scenedetect>=0.6.2"]
local-tts = ["pyttsx3>=2.90"]
ai = ["torch>=2.0.0", "transformers>=4.30.0"]
whisper = ["faster-whisper>=1.0.0"]
youtube = ["youtube-transcript-api>=0.6.0", "yt-dlp>=2024.0.0"]
openmontage = ["faster-whisper>=1.0.0", "scenedetect>=0.6.2", "av>=11"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1.0", "mypy>=2.0"]
all = ["librosa>=0.10.0", "soundfile>=0.12.0", "scenedetect>=0.6.2", "pyttsx3>=2.90", "faster-whisper>=1.0.0", "youtube-transcript-api>=0.6.0"]

[project.scripts]
video-toolkit = "video_toolkit.cli:main"
vt = "video_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/skyjilygao/video-toolkit"
Documentation = "https://github.com/skyjilygao/video-toolkit"
Repository = "https://github.com/skyjilygao/video-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_toolkit = ["py.typed"]

# ===== 开发工具配置 =====
[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.mypy]
# 项目运行要求为 Python >= 3.14.5；按最低支持大版本（3.14）的语义进行类型检查，
# 保证不同环境（解释器版本）下检查结果一致
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

# 可选/动态加载的第三方模块无类型存根，忽略其缺失（避免误报）
[[tool.mypy.overrides]]
module = [
    "fal_client",
    "yaml",
    "ffmpeg",
    "faster_whisper",
    "scenedetect",
    "scenedetect.*",
"tools",
"tools.*",
"OpenMontage.*",
"yt_dlp",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
